# Deltas from detekt's default ruleset (buildUponDefaultConfig = true in app/build.gradle.kts).
# Reviewed pre-existing findings live in app/detekt-baseline.xml.

complexity:
  LongParameterList:
    # Composables take one parameter per piece of state plus one callback per user action.
    functionThreshold: 8

naming:
  FunctionNaming:
    # Compose convention: @Composable functions are PascalCase.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Mostly flags self-explanatory UI constants (24.dp, 300ms) for a codebase this size.
    active: false
